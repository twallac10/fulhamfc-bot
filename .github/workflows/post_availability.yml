name: Post Availability Updates to Bluesky

on:
  schedule:
    - cron: '30 8-20/3 * * *'  # Every 3 hours through the day; only new injury/suspension news is posted
  workflow_dispatch:

jobs:
  post_availability:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/twallac10/fulhamfc-bot:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Run and post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/11_post_availability.py --post
