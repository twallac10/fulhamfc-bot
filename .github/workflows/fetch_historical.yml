name: fetch_historical

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6am UTC
  workflow_dispatch:      # Also allow manual trigger

jobs:
  fetch_historical:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/twallac10/fulhamfc-bot:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Rebuild Premier League history (2001-02 to last season)
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: python scripts/06_fetch_historical_seasons.py --refresh
