name: Post Matchday Updates to Bluesky

on:
  schedule:
    # Every 15 minutes, 7:00-22:45 UTC. The script exits immediately unless
    # Fulham play today, then posts the preview, starting XI and result once each.
    - cron: '*/15 7-22 * * *'
  workflow_dispatch:

concurrency:
  group: post-matchday
  cancel-in-progress: false

jobs:
  post_matchday:
    runs-on: ubuntu-latest
    # Lighter than the shared container for a job that runs this often
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Post matchday update
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/10_post_matchday.py --post
